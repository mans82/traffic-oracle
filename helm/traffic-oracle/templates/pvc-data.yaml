apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "traffic-oracle.dataClaimName" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.dataSize }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
