apiVersion: v1
kind: Service
metadata:
  name: {{ include "traffic-oracle.staticName" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
    component: fetcher
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "traffic-oracle.selectorLabels" (dict "ctx" . "component" "fetcher") | nindent 4 }}
