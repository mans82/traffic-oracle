apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traffic-oracle.grafanaName" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
    component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "traffic-oracle.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traffic-oracle.labels" . | nindent 8 }}
        component: grafana
      annotations:
        checksum/grafana-config: {{ include (print $.Template.BasePath "/grafana-configmaps.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "traffic-oracle.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.3.0-18925857539
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "traffic-oracle.grafanaSecretName" . }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "traffic-oracle.grafanaSecretName" . }}
                  key: admin-password
            - name: TRAFFIC_ORACLE_CSV_BASE_URL
              value: http://{{ include "traffic-oracle.staticName" . }}/static
            - name: GF_SERVER_ROOT_URL
              value: {{ include "traffic-oracle.grafanaRootUrl" . | quote }}
            - name: GF_USERS_DEFAULT_HOME_PAGE
              value: /d/adxgqqh/traffic-oracle
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: yesoreyeram-infinity-datasource
            - name: TZ
              value: {{ .Values.timezone | quote }}
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "traffic-oracle.grafanaName" . }}
        - name: provisioning-datasources
          configMap:
            name: {{ include "traffic-oracle.fullname" . }}-grafana-datasources
        - name: provisioning-dashboards
          configMap:
            name: {{ include "traffic-oracle.fullname" . }}-grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: {{ include "traffic-oracle.fullname" . }}-grafana-dashboards
