apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "traffic-oracle.fullname" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ include "traffic-oracle.ingressHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "traffic-oracle.grafanaName" . }}
                port:
                  number: 80
