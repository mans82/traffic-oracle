apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traffic-oracle.fullname" . }}-fetcher
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
    component: fetcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "traffic-oracle.selectorLabels" (dict "ctx" . "component" "fetcher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traffic-oracle.labels" . | nindent 8 }}
        component: fetcher
      annotations:
        checksum/origins: {{ include (print $.Template.BasePath "/configmap-origins.yaml") . | sha256sum }}
        checksum/static-config: {{ include (print $.Template.BasePath "/configmap-static.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "traffic-oracle.fullname" . }}
      automountServiceAccountToken: false
      containers:
        - name: fetcher
          image: {{ required "fetcher.image is required" .Values.fetcher.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /app/runtime/static
              ln -sf /app/runtime/token-state.json /app/token-state.json
              exec python3 -m traffic_oracle.scheduler
          env:
            - name: FETCH_INTERVAL_MINUTES
              value: {{ .Values.fetcher.intervalMinutes | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
          envFrom:
            - secretRef:
                name: {{ required "credentials.secretName is required" .Values.credentials.secretName }}
          volumeMounts:
            - name: data
              mountPath: /app/runtime
            - name: origins
              mountPath: /app/origins.yaml
              subPath: origins.yaml
              readOnly: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: static
          image: nginxinc/nginx-unprivileged:1.29.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
              subPath: static
              readOnly: true
            - name: static-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "traffic-oracle.dataClaimName" . }}
        - name: origins
          configMap:
            name: {{ include "traffic-oracle.fullname" . }}-origins
        - name: static-config
          configMap:
            name: {{ include "traffic-oracle.fullname" . }}-static
