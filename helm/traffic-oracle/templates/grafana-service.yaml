apiVersion: v1
kind: Service
metadata:
  name: {{ include "traffic-oracle.grafanaName" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
    component: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "traffic-oracle.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
