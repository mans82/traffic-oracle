apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "traffic-oracle.fullname" . }}-static
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /static/ {
            alias /usr/share/nginx/html/;
            autoindex off;
            try_files $uri =404;
        }
    }
