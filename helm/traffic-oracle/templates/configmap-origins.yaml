apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "traffic-oracle.fullname" . }}-origins
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
data:
  origins.yaml: |
    {{- required "origins.pairs must list at least one route pair" .Values.origins.pairs | dict "pairs" | toYaml | nindent 4 }}
