apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "traffic-oracle.staticName" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
    component: fetcher
spec:
  podSelector:
    matchLabels:
      {{- include "traffic-oracle.selectorLabels" (dict "ctx" . "component" "fetcher") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "traffic-oracle.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
