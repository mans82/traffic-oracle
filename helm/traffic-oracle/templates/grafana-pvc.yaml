apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "traffic-oracle.grafanaName" . }}
  labels:
    {{- include "traffic-oracle.labels" . | nindent 4 }}
    component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.grafanaSize }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
